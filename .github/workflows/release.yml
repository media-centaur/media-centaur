name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # The tag must name the version mix.exs declares.
  # ────────────────────────────────────────────────────────────────────────
  version:
    name: Check the tag against mix.exs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#v}"
          mix_version=$(grep -E '^[[:space:]]*version:' mix.exs | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$mix_version" != "$version" ]; then
            echo "::error::Tag version ($version) does not match mix.exs version ($mix_version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────────────────
  # Build each platform's tarball natively — see build-release.yml.
  # ────────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, macos]
    uses: ./.github/workflows/build-release.yml
    with:
      platform: ${{ matrix.platform }}
      version: ${{ needs.version.outputs.version }}

  # ────────────────────────────────────────────────────────────────────────
  # Atomically publish all matrix-built tarballs to a single GitHub Release.
  # Runs only after every matrix build succeeds — no half-published release.
  # ────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download all matrix tarballs
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: tarball-*
          merge-multiple: true

      - name: Generate consolidated SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          echo "--- artifacts/ ---"
          ls -la

      - name: Extract release notes from CHANGELOG
        run: |
          tag="${{ steps.version.outputs.tag }}"
          notes=/tmp/release-notes.md

          if [ -f CHANGELOG.md ]; then
            # Print lines between the `## <tag>` header (exclusive) and
            # the next `## v` header. Blank leading/trailing lines trimmed.
            awk -v tag="$tag" '
              $0 ~ "^## " tag " " { in_section=1; next }
              in_section && /^## v[0-9]/ { exit }
              in_section { print }
            ' CHANGELOG.md | sed -e '/./,$!d' > "$notes"
          fi

          if [ ! -s "$notes" ]; then
            cat > "$notes" <<EOF
          Cross-platform release: Linux x86_64 + macOS arm64.

          Install: see [docs/installation.md](https://github.com/${{ github.repository }}/blob/main/docs/installation.md)
          EOF
          fi

          echo "--- Release notes for $tag ---"
          cat "$notes"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file /tmp/release-notes.md \
              artifacts/*
          fi
