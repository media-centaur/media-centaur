name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Matrix: build the release tarball on each target OS natively.
  #
  # We CAN'T cross-compile: priv/mac_listener (a file_system dep) is a
  # per-platform binary that Hex ships pre-compiled for the host OS.
  # ubuntu-22.04 = older glibc → wider compatibility on user Linuxes.
  # macos-14     = first GHA runner image on Apple Silicon arm64.
  # ────────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.platform_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform_tag: linux-x86_64
            required_unit_path: share/systemd/media-centarr.service
          - os: macos-14
            platform_tag: darwin-arm64
            required_unit_path: share/launchd/com.media-centarr.app.plist
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify mix.exs version matches tag
        run: |
          mix_version=$(grep -E '^\s*version:' mix.exs | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$mix_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.version }}) does not match mix.exs version ($mix_version)"
            exit 1
          fi

      - name: Write build info for runtime display
        run: |
          mkdir -p priv
          built_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          git_sha="${GITHUB_SHA:-unknown}"
          printf '{"version":"%s","built_at":"%s","git_sha":"%s"}\n' \
            "${{ steps.version.outputs.version }}" \
            "$built_at" \
            "$git_sha" > priv/build_info.json
          cat priv/build_info.json

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-release-mix-${{ hashFiles('**/mix.lock') }}

      - name: Cache _build
        uses: actions/cache@v5
        with:
          path: _build
          key: ${{ runner.os }}-release-build-${{ hashFiles('**/mix.lock') }}

      - name: Fetch prod deps
        run: MIX_ENV=prod mix deps.get --only prod

      - name: Compile
        env:
          MIX_ENV: prod
          MIX_OS_DEPS_COMPILE_PARTITION_COUNT: "8"
        run: mix compile

      - name: Deploy assets
        run: MIX_ENV=prod mix assets.deploy

      - name: Sync defaults into shared release overlay
        run: |
          mkdir -p rel/platforms/shared/share/defaults
          cp defaults/media-centarr.toml rel/platforms/shared/share/defaults/media-centarr.toml

      - name: Build release tarball
        run: MIX_ENV=prod mix release --overwrite

      - name: Stage release artifact
        id: stage
        run: |
          version="${{ steps.version.outputs.version }}"
          platform="${{ matrix.platform_tag }}"
          src="_build/prod/media_centarr-${version}.tar.gz"
          if [ ! -f "$src" ]; then
            echo "::error::Expected tarball not found at $src"
            ls -la _build/prod/
            exit 1
          fi
          mkdir -p artifacts
          dest="artifacts/media-centarr-${version}-${platform}.tar.gz"
          cp "$src" "$dest"
          echo "tarball=$dest" >> "$GITHUB_OUTPUT"

      - name: Smoke-test tarball contents
        run: |
          tarball="${{ steps.stage.outputs.tarball }}"
          required_unit="${{ matrix.required_unit_path }}"
          tar -tzf "$tarball" | grep -q '^bin/media-centarr-install$' \
            || (echo "::error::Tarball missing bin/media-centarr-install"; exit 1)
          tar -tzf "$tarball" | grep -q '^bin/media_centarr$' \
            || (echo "::error::Tarball missing bin/media_centarr"; exit 1)
          tar -tzf "$tarball" | grep -q "^${required_unit}$" \
            || (echo "::error::Tarball missing ${required_unit}"; exit 1)
          tar -tzf "$tarball" | grep -q '^share/defaults/media-centarr.toml$' \
            || (echo "::error::Tarball missing share/defaults/media-centarr.toml"; exit 1)

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v6
        with:
          name: tarball-${{ matrix.platform_tag }}
          path: ${{ steps.stage.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────
  # Atomically publish all matrix-built tarballs to a single GitHub Release.
  # Runs only after every matrix build succeeds — no half-published release.
  # ────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download all matrix tarballs
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: tarball-*
          merge-multiple: true

      - name: Generate consolidated SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          echo "--- artifacts/ ---"
          ls -la

      - name: Extract release notes from CHANGELOG
        run: |
          tag="${{ steps.version.outputs.tag }}"
          notes=/tmp/release-notes.md

          if [ -f CHANGELOG.md ]; then
            # Print lines between the `## <tag>` header (exclusive) and
            # the next `## v` header. Blank leading/trailing lines trimmed.
            awk -v tag="$tag" '
              $0 ~ "^## " tag " " { in_section=1; next }
              in_section && /^## v[0-9]/ { exit }
              in_section { print }
            ' CHANGELOG.md | sed -e '/./,$!d' > "$notes"
          fi

          if [ ! -s "$notes" ]; then
            cat > "$notes" <<EOF
          Cross-platform release: Linux x86_64 + macOS arm64.

          Install: see [docs/installation.md](https://github.com/${{ github.repository }}/blob/main/docs/installation.md)
          EOF
          fi

          echo "--- Release notes for $tag ---"
          cat "$notes"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file /tmp/release-notes.md \
              artifacts/*
          fi
