name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: mix precommit (linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y inotify-tools

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache build
        uses: actions/cache@v5
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Install dependencies
        run: mix deps.get

      - name: Run precommit checks
        # Suite-time gate (ADR-049 Principle 1): a hung suite must fail the
        # build in minutes, not run to the GitHub Actions ceiling. Normal
        # precommit is ~3-4 min on a warm cache; 900s is generous headroom
        # that still catches the cumulative-orphan hang class that once
        # regressed the suite (each test +~1s in teardown → never finishes).
        # `-k 60` SIGKILLs a wedged BEAM 60s after the SIGTERM.
        run: timeout -k 60 900 mix precommit

  # macOS lint-and-compile gate. The full `mix test` suite expects the
  # macOS Platform.* impls (Autostart.Launchd, DriveProbe.BsdDf,
  # LogSource.Files) which land in a future campaign phase — until then
  # running the Linux impls on macOS would fail by design. What we CAN
  # validate today and care about:
  #
  #   * Code compiles natively on macOS (catches NIF-dep or file_system
  #     mac_listener-style breakage before it ships).
  #   * Every Credo check — including MC0017 PlatformBranchingDiscipline —
  #     works cross-platform.
  #   * Formatter is OS-agnostic.
  #   * JS suite (input system, no Elixir touch) is OS-agnostic.
  #
  # This job extends to a full precommit once the macOS impls land in
  # campaign Phase 5 — see campaigns/macos-platform-support.md.
  macos:
    name: lint + compile (macos)
    runs-on: macos-14
    # MIX_ENV=test mirrors the Linux precommit (configured via
    # preferred_envs: [precommit: :test] in mix.exs). Avoids pulling
    # path-only dev deps like ex_code_view that don't exist on CI.
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache build
        uses: actions/cache@v5
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Install dependencies
        run: mix deps.get

      # Compile deps first WITHOUT --warnings-as-errors. Hex deps (e.g.
      # `toml`) use Elixir 1.19-deprecated single-quoted charlists; the
      # Linux job dodges this via _build cache (one-time clean compile)
      # but a fresh macOS runner hits the warnings on every CI run.
      # Our policy is "zero warnings in app code", not "zero warnings
      # transitively in hex deps".
      #
      # Serial deps.compile: parallel mode races on the
      # credo_check_error_handling_ecto_oban → credo edge (the former
      # `use Credo.Check` at compile-time before credo is loaded).
      - name: Compile deps
        run: mix deps.compile

      - name: Compile app (warnings-as-errors)
        run: mix compile --warnings-as-errors --no-deps-check

      - name: Format check
        run: mix format --check-formatted

      - name: Credo (incl. MC0017)
        run: mix credo --strict

      - name: Boundaries
        run: mix boundaries

      - name: JS tests
        run: mix cmd bun test --dots assets/js/input/
