# defaults/media-centaur.toml
#
# Shipped default configuration for Media Centaur — Backend.
# Copy this file to ~/.config/media-centaur/media-centaur.toml and edit as needed.
#
# This file carries only bootstrap state — the values the app needs
# before its database is reachable: the database file location, the HTTP
# port, and the initial media-directory seed. Every other setting is
# configured in the app (open Settings to adjust them) and lives in the
# database. Runtime values left in this file are ignored — the database
# is the single source of truth.

# Path to the SQLite database file.
database_path = "~/.local/share/media-centaur/media-centaur.db"

# HTTP port the web UI listens on. Requires restart to change.
# Default: 2160 (prod), 1080 (dev).
# port = 2160

# Media directories are seeded from here on first boot only — open
# Settings → Library → Media Directories to manage them thereafter. Any
# TOML `media_dirs` present here (or in an existing user config) are
# imported into the app's database on first boot, after which this key is
# ignored and edits live in the UI.
# media_dirs = ["/mnt/media/movies", "/mnt/media/tv"]

# ---------------------------------------------------------------------------
# Everything else — TMDB, pipeline thresholds, playback paths, Prowlarr,
# download client, the data directory, excluded directories, release
# tracking, update behaviour, … — is managed through the Settings page in
# the app and stored in the database. Values for those keys placed in this
# file are NOT read; set them in Settings instead.
# ---------------------------------------------------------------------------
