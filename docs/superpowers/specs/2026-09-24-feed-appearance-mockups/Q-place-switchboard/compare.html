<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Round 12 · the picture and the time</title><link rel="stylesheet" href="../base.css"><style>
body{background:oklch(11% 0.015 264);padding:28px 24px 60px}
h1{font-size:22px;margin:0 0 6px}p.lede{margin:0 0 24px;max-width:110ch;font-size:15px;line-height:1.5;color:oklch(93% 0.01 264/.7)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 24px}

</style></head><body><h1>Round 12 · where the picture sits and where the time sits</h1>
<p class="lede">R2 as the reference, then four compositions that take the picture off the right and the time out of the middle, at half size. Open one for the 1920 render; the <a href="index.html" style="color:var(--p)">switchboard</a> flips every knob of the three rounds.</p>
<div class="grid"><figure class="today"><figcaption><b>R2</b> <span>the picture in a box on the right, the time at the text zone’s edge, mid-band: the reference</span> <a href="../R2-logo-headline/index.html">open</a></figcaption><div class="vp"><iframe src="../R2-logo-headline/index.html" loading="eager"></iframe></div></figure><figure><figcaption><b>S1 · Picture left</b> <span>the still takes the poster’s slot as a 16:9 thumbnail at the tile’s right — the whole frame, no crop · tile, picture, words, in the settled order · the time at the band’s right edge · the logo as the headline; the band 264, the thumbnail 391×220</span> <a href="../S1-picture-left/index.html">open</a></figcaption><div class="vp"><iframe src="../S1-picture-left/index.html" loading="eager"></iframe></div></figure><figure><figcaption><b>S2 · Picture flush</b> <span>the still at the band’s left edge at the band’s full height, the whole frame (469×264) · the tile after it, then the words · the time at the edge · the hairline runs from the picture’s edge</span> <a href="../S2-picture-flush/index.html">open</a></figcaption><div class="vp"><iframe src="../S2-picture-flush/index.html" loading="eager"></iframe></div></figure><figure><figcaption><b>S3 · Full bleed, time at the edge</b> <span>the still under the whole band, the words on the left scrim as before · the time at the top right over a vignette that darkens the last 300px · the picture is not on the right because it is everywhere</span> <a href="../S3-full-bleed/index.html">open</a></figcaption><div class="vp"><iframe src="../S3-full-bleed/index.html" loading="eager"></iframe></div></figure><figure><figcaption><b>S4 · Picture left, typed title</b> <span>S1 without the logo: the typed title on line 2, the band 224, the thumbnail 320×180 · for judging the composition apart from the logo question</span> <a href="../S4-picture-left-typed/index.html">open</a></figcaption><div class="vp"><iframe src="../S4-picture-left-typed/index.html" loading="eager"></iframe></div></figure></div>
<script>function fit(){document.querySelectorAll('.vp').forEach(v=>v.style.setProperty('--k',(v.clientWidth/1920).toFixed(4)))}fit();addEventListener('resize',fit)</script>
